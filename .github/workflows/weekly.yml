name: Weekly

on:
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      run-ts: true
      run-helper: true
      run-external: true
      restore-caches: false
      save-shared-caches: false
      save-main-caches: false
