name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 変更したパスで走らせるジョブを選ぶ。main への push は全部走らせる
  changes:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      # checkout せず、PR の変更ファイルを API で取る
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "ts=true" >> "$GITHUB_OUTPUT"; echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          # 既知の docs 以外が 1 つでもあれば走らせる（知らないパスは走る側に倒す）
          code=$(printf '%s\n' "$files" | grep -Ev '^(docs/|LICENSE$)|\.md$' || true)
          ts=false; swift=false
          if printf '%s\n' "$code" | grep -Ev '^helper/' | grep -q .; then ts=true; fi
          # helper/package.json は server のテスト（server/test/helperScripts.it.test.ts）が読むので、helper/ の中でもこれだけは ts も走らせる
          if printf '%s\n' "$code" | grep -Fqx 'helper/package.json'; then ts=true; fi
          if printf '%s\n' "$code" | grep -Eq '^(helper/|\.github/workflows/)'; then swift=true; fi
          echo "ts=$ts" >> "$GITHUB_OUTPUT"; echo "swift=$swift" >> "$GITHUB_OUTPUT"

  # typecheck・unit・軽い IT を server と web の両方で 1 ジョブにまとめる。Chromium は要らない
  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    name: ts (typecheck・unit・IT)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      # ルートの pnpm typecheck は helper の swift build まで走るので、TS の 2 パッケージに絞る（server の typecheck は点検 script も走らせる）
      - run: pnpm --filter @live-mindmap/server --filter @live-mindmap/web typecheck
      - run: pnpm --filter @live-mindmap/server --filter @live-mindmap/web test
      - run: pnpm --filter @live-mindmap/server --filter @live-mindmap/web test:it

  # 重い IT（--project heavy）全体を 4 つの runner にテスト単位で割る。--shard はファイル単位で、ファイルの中は割れない。
  # vitest list で一覧を取り、file:line ごとにまとめて配る（each やループの同じ行のテストは 1 つの runner に入り、重複して走らない）。
  # 新しく足した重い IT も、設定を書き換えずにどれかの runner に入る。Chromium を入れるのはこのジョブと e2e ジョブだけ
  heavy:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: heavy IT (${{ matrix.shard }}/4)
    env:
      LIVE_MINDMAP_DEPS: ${{ runner.temp }}/deps
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - id: chromium-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.LIVE_MINDMAP_DEPS }}/chromium
          key: managed-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('server/managed-deps/chromium/package-lock.json') }}
      - run: pnpm --filter @live-mindmap/server deps:install chromium
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.LIVE_MINDMAP_DEPS }}/chromium
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}
      - working-directory: server
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          tests=$(pnpm exec vitest list --project heavy --json \
            | jq -r --arg root "$PWD/" '.[] | "\(.file | ltrimstr($root)):\(.location.line // error("location.line が無いテスト: \(.file) \(.name)"))"')
          total=$(printf '%s\n' "$tests" | grep -c . || true)
          mine=$(printf '%s\n' "$tests" | jq -R -s -r --argjson n 4 --argjson i "$SHARD" 'split("\n") | map(select(. != "")) | group_by(.) | to_entries[] | select(.key % $n == $i) | .value[]')
          count=$(printf '%s\n' "$mine" | grep -c . || true)
          echo "runner $SHARD: $count of $total tests"
          targets=$(printf '%s\n' "$mine" | sort -u | grep . || true)
          if [ -z "$targets" ]; then
            echo "runner $SHARD: 受け持ちが無いので vitest run を呼ばない"
            exit 0
          fi
          echo "$targets"
          pnpm exec vitest run --project heavy $targets

  # E2E（e2e/ の test:e2e、全 target）。コミットした replay cache を --strict-cache で再生するだけで、モデルも資格情報も使わない。
  # 再生できないステップは REPLAY_STALE で落ちる。リトライは 0（e2e/package.json）。helper は fake-helper を使うので、helper だけの変更では回さない
  e2e:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-24.04
    env:
      E2E_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: e2e-playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @live-mindmap/e2e test:e2e

  helper:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    # ヘルパーは SpeechAnalyzer を使うので macOS 26 の SDK が要る
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # WebRTC AEC3 のライブラリ。キャッシュが外れたときだけ uv を入れてビルドする
      - id: apm
        uses: actions/cache@v6
        with:
          path: helper/.deps/webrtc-apm
          key: webrtc-apm-${{ runner.os }}-${{ hashFiles('helper/scripts/build-webrtc-apm.sh') }}
      - if: steps.apm.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - if: steps.apm.outputs.cache-hit != 'true'
        run: bash helper/scripts/build-webrtc-apm.sh
      - id: swift
        run: echo "version=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # PR で保存したキャッシュは他の PR から使えないので、保存は main の push だけ
      - id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: helper/.build
          key: helper-build-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('helper/Package.swift', 'helper/Sources/**', 'helper/Tests/**', 'helper/scripts/build-webrtc-apm.sh') }}
          restore-keys: helper-build-${{ runner.os }}-${{ steps.swift.outputs.version }}-
      # checkout で mtime が変わるので、中身のハッシュで比べて変わっていないファイルはコンパイルしない
      - run: swift build --build-tests -Xswiftc -enable-incremental-file-hashing
        working-directory: helper
      # helper の package.json の test は Command Line Tools のパスを渡す（手元に Xcode が無い前提）。
      # ランナーには Xcode があるので swift test をそのまま使う。
      # 層の選び方は helper/package.json の test・test:it・test:it:heavy と同じ
      - name: unit
        run: swift test --skip-build --skip 'ITTests/|HeavyTests/'
        working-directory: helper
      - name: IT
        run: swift test --skip-build --filter 'ITTests/'
        working-directory: helper
      - name: heavy IT
        run: swift test --skip-build --filter 'HeavyTests/'
        working-directory: helper
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: helper/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # ruleset の必須チェック。ID を変えない。
  # always() が無いと、依存が落ちたときに skipped（= Success 扱い）になって落ちた PR がマージできてしまう
  check:
    if: always()
    needs: [changes, ts, heavy, e2e, helper]
    runs-on: ubuntu-slim
    steps:
      # success か skipped 以外（failure・cancelled・runner を取れずに終わったときの値・空など）が 1 つでもあれば落とす
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          bad=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi
