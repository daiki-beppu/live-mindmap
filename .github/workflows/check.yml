name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # ヘルパーは SpeechAnalyzer を使うので macOS 26 の SDK が要る
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @live-mindmap/server exec playwright install chromium
      # helper のビルド（pnpm typecheck の swift build と swift test）の前に、WebRTC AEC3 のライブラリを用意する
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6
        with:
          path: helper/.deps/webrtc-apm
          key: webrtc-apm-${{ runner.os }}-${{ hashFiles('helper/scripts/build-webrtc-apm.sh') }}
      - run: bash helper/scripts/build-webrtc-apm.sh
      - run: pnpm typecheck
      - run: pnpm --filter @live-mindmap/server test
      - run: pnpm --filter @live-mindmap/web test
      # helper の package.json の test は Command Line Tools のパスを渡す（手元に Xcode が無い前提）。
      # ランナーには Xcode があるので swift test をそのまま使う
      - run: swift test
        working-directory: helper
