name: check

on:
  pull_request:

jobs:
  bisect:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        variant: [main-repeat, head-filter-repeat, timer-do-catch, timer-precompute]
    steps:
      - uses: actions/checkout@v5
      - name: apply variant
        working-directory: helper
        run: |
          git fetch origin main --depth=1
          case "${{ matrix.variant }}" in
            main-repeat) git checkout FETCH_HEAD -- . ;;
            timer-do-catch) perl -pi -e 's/try\? await sleep\((.*)\)$/do { try await sleep($1) } catch { return }/' Sources/HelperCore/Duplicates.swift ;;
            timer-precompute) perl -0pi -e 's/let timer = Task \{ \[sleep\] in/let wait = max(.zero, .seconds(duplicateHoldLimit) - (.now - heldSince))\n        let timer = Task { [sleep, wait] in/; s/try\? await sleep\(max.*\)\n/try? await sleep(wait)\n/' Sources/HelperCore/Duplicates.swift ;;
          esac
          git diff
      - name: test
        working-directory: helper
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,symbolicate=full
        run: |
          xcodebuild -version; swift --version
          swift build --build-tests
          case "${{ matrix.variant }}" in
            main-repeat|head-filter-repeat) for i in $(seq 1 10); do echo "== run $i"; swift test --skip-build --no-parallel --filter DuplicateRelayTests || exit 1; done ;;
            *) swift test --skip-build --no-parallel ;;
          esac
