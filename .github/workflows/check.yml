name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # 変更したパスで走らせるジョブを選ぶ。main への push は external 以外を走らせる
  changes:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      swift: ${{ steps.filter.outputs.swift }}
      external: ${{ steps.filter.outputs.external }}
    steps:
      # checkout せず、PR の変更ファイルを API で取る
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf '%s\n' ts=true swift=true external=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          # 既知の docs 以外が 1 つでもあれば走らせる（知らないパスは走る側に倒す）
          code=$(printf '%s\n' "$files" | grep -Ev '^(docs/|LICENSE$)|\.md$' || true)
          ts=false; swift=false; external=false
          if printf '%s\n' "$code" | grep -Ev '^helper/' | grep -q .; then ts=true; fi
          # server のテストが読む helper 内のファイルは、ts も走らせる
          if printf '%s\n' "$code" | grep -Fqx -e 'helper/package.json' -e 'helper/Tests/HelperCoreTests/Fixtures/helper-events.jsonl'; then ts=true; fi
          if printf '%s\n' "$code" | grep -Eq '^(helper/|\.github/workflows/)'; then swift=true; fi
          if printf '%s\n' "$files" | grep -Eq '^server/(managed-deps/|scripts/install-managed-deps\.ts$|src/managedDeps\.ts$)'; then external=true; fi
          printf '%s\n' "ts=$ts" "swift=$swift" "external=$external" >> "$GITHUB_OUTPUT"

  tests:
    needs: changes
    uses: ./.github/workflows/tests.yml
    with:
      run-ts: ${{ needs.changes.outputs.ts == 'true' }}
      run-external: ${{ needs.changes.outputs.external == 'true' }}
      run-helper: ${{ needs.changes.outputs.swift == 'true' }}
      restore-caches: true
      save-shared-caches: true
      save-main-caches: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  # ruleset の必須チェック。ID を変えない。
  # always() が無いと、依存が落ちたときに skipped（= Success 扱い）になって落ちた PR がマージできてしまう
  check:
    if: always()
    needs: [changes, tests]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # success か skipped 以外（failure・cancelled・runner を取れずに終わったときの値・空など）が 1 つでもあれば落とす
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          TEST_RESULTS_JSON: ${{ needs.tests.outputs.results }}
        run: |
          bad=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi
          # 呼び出し成功でも出力が欠けていれば、テスト成功とは扱わない
          printf '%s' "$TEST_RESULTS_JSON" | jq -e -s '
            length == 1 and (.[0] |
              type == "object" and
              (keys == ["e2e", "external", "heavy", "helper", "ts"]) and
              all(.[]; type == "object" and (.result | type == "string")))
          ' > /dev/null
          bad=$(printf '%s' "$TEST_RESULTS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "$bad"
            exit 1
          fi
