# 一時的な計測用（issue #220）。research/ci-swift-cache ブランチだけで走る
# 1〜3 回目の split / shared ジョブ（キャッシュなし）は履歴を参照
name: research-swift-cache

on:
  push:
    branches: [research/ci-swift-cache]
  workflow_dispatch:

jobs:
  # .build を actions/cache で持ち越す。毎回保存し、次の回で前回のものを復元
  cached:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: plain
            flags: ""
            paths: helper/.build
          - variant: hashing
            flags: -Xswiftc -enable-incremental-file-hashing
            paths: helper/.build
          - variant: mtime
            flags: ""
            paths: helper/.build
          # SwiftPM の共有キャッシュ（マニフェストの評価結果など）も持ち越す
          - variant: hashing-swiftpm
            flags: -Xswiftc -enable-incremental-file-hashing
            paths: |
              helper/.build
              ~/Library/Caches/org.swift.swiftpm
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6
        with:
          path: helper/.deps/webrtc-apm
          key: webrtc-apm-${{ runner.os }}-${{ hashFiles('helper/scripts/build-webrtc-apm.sh') }}
      - run: bash helper/scripts/build-webrtc-apm.sh
      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.paths }}
          key: research-swift-${{ matrix.variant }}-${{ github.sha }}
          restore-keys: research-swift-${{ matrix.variant }}-
      - run: |
          echo "hit=${{ steps.restore.outputs.cache-hit }} matched=${{ steps.restore.outputs.cache-matched-key }}"
          du -sh helper/.build ~/Library/Caches/org.swift.swiftpm || true
          ls ~/Library/Caches/org.swift.swiftpm || true
      # ファイルの中身から決まる mtime を付ける（中身が同じなら前回と同じ mtime になる）
      - if: matrix.variant == 'mtime'
        run: |
          git ls-files -z helper | xargs -0 perl -MDigest::SHA=sha1_hex -e 'for (@ARGV) { open my $f, "<", $_ or die; local $/; my $t = 1000000000 + hex(substr(sha1_hex(<$f>), 0, 7)); close $f; utime $t, $t, $_ }'
          ls -lT helper/Package.swift
      - name: swift build --build-tests
        working-directory: helper
        run: /usr/bin/time -p swift build --build-tests ${{ matrix.flags }} 2>&1 | tee ../b.log; grep -c Compiling ../b.log || true
      - name: no-op rebuild
        working-directory: helper
        run: /usr/bin/time -p swift build --build-tests ${{ matrix.flags }} 2>&1 | tail -3
      - name: swift test --skip-build
        working-directory: helper
        run: /usr/bin/time -p swift test --skip-build 2>&1 | tail -3
      - run: du -sh helper/.build ~/Library/Caches/org.swift.swiftpm || true
      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ matrix.paths }}
          key: research-swift-${{ matrix.variant }}-${{ github.sha }}
