packages:
  - web
  - server
  - helper
  - e2e
# bootstrap runs install alongside AEC3 and Swift resolution.
verifyDepsBeforeRun: false
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
# lock の再生成で入る推移依存には Renovate の待ちが効かないため、pnpm でも公開から 3 日（分で指定）たった版だけを解決する。明示すると strict になり、若い版しか合わないときは入れずに止まる
minimumReleaseAge: 4320
# Foldkit の peer は effect / @effect/platform-browser を 4.0.0 の exact で要求する。server と web を同じ新しい版にそろえるため許可する（Foldkit の peer が追いついたら外す）
peerDependencyRules:
  allowedVersions:
    foldkit>effect: 4.0.6
    foldkit>@effect/platform-browser: 4.0.6
    '@foldkit/ui>effect': 4.0.6
    '@foldkit/vite-plugin>effect': 4.0.6
